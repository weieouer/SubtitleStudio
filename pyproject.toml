# 本项目以源码维护、默认在线 EXE 发布，运行依赖由 requirements*.txt 管理。
# 此文件仅统一源码工具设置，不声明需要安装到系统的 Python 发行包。
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["runtime", "data", "wheels", "dist", "installer/build"]

[tool.pyright]
include = ["main.py", "backend", "tools"]
exclude = ["runtime", "data", "wheels", "dist", "installer/build"]
pythonVersion = "3.13"
extraPaths = ["backend"]
